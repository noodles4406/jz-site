<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>竞价选股集合页</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c1e21;--mu:#6b7280;--bd:#e5e7eb;--red:#d2322c;--green:#1a9a44;--brand:#0f8a4d}
@media (prefers-color-scheme:dark){:root{--bg:#141618;--card:#1e2124;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2d3136}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);
font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px}
h2{font-size:15px;margin:18px 0 8px;color:var(--brand)}
.meta{color:var(--mu);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.cv{font-size:18px;font-weight:600}.ck{font-size:12px;color:var(--mu)}
.ks{font-size:11px;color:var(--mu)}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:12.5px}
th,td{border:1px solid var(--bd);padding:5px 6px;text-align:center}
th{background:color-mix(in srgb,var(--card) 70%,var(--bg));color:var(--mu);font-weight:500}
td:first-child{text-align:left}
.r{color:var(--red);font-weight:600}.g{color:var(--green);font-weight:600}
.code{color:var(--mu);font-size:11px}
.prob{color:var(--brand);font-weight:600}
.tags{color:var(--mu);font-size:11px}
.wrap{overflow-x:auto}
#gate{max-width:340px;margin:25vh auto;text-align:center}
#gate input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;
background:var(--card);color:var(--tx);font-size:16px;text-align:center}
#gate button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;
background:var(--brand);color:#fff;font-size:15px}
#err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
</style></head><body>

async function sha256(t){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))}
async function ks(key,nonce,n){const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);
let o=new Uint8Array(0);const nb=new Uint8Array(16+8);nb.set(nonce,0);
for(let i=0;o.length<n;i++){new DataView(nb.buffer).setUint32(20,i,false);
const b=new Uint8Array(await crypto.subtle.sign('HMAC',k,nb));
const t=new Uint8Array(o.length+b.length);t.set(o);t.set(b,o.length);o=t}return o.slice(0,n)}
async function decrypt(tok){const key=await sha256(tok+'|'+SALT);
const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
const nonce=raw.slice(0,16),ct=raw.slice(16);
const s=await ks(key,nonce,ct.length);
const pt=new Uint8Array(ct.length);for(let i=0;i<ct.length;i++)pt[i]=ct[i]^s[i];
const text=new TextDecoder().decode(pt);
const h=[].map.call(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text))),b=>b.toString(16).padStart(2,'0')).join('').slice(0,16);
if(h!==CHK)throw new Error('口令错误');
return text}
